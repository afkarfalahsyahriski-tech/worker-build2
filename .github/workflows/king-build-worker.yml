name: KING Build Worker
run-name: "KING BUILD ${{ inputs.jobId }}"

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Unique build job ID
        required: true
        type: string
      userId:
        description: Telegram user ID
        required: false
        default: "0"
        type: string
      payload:
        description: JSON build payload
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: king-build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD_JSON: ${{ inputs.payload }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
      JAVA_TOOL_OPTIONS: "-Xmx4g"

    steps:
      # ═══════════════════════════════════════════════════════════════
      # SETUP
      # ═══════════════════════════════════════════════════════════════
      - name: Checkout worker repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmdline-tools;latest'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # ═══════════════════════════════════════════════════════════════
      # PARSE PAYLOAD
      # ═══════════════════════════════════════════════════════════════
      - name: Parse build payload
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os

          payload = json.loads(os.environ.get("PAYLOAD_JSON", "{}"))
          mode = str(payload.get("mode", "zip")).strip().lower()
          if mode not in {"zip", "url", "doctor"}:
              raise SystemExit(f"Unsupported mode: {mode}")

          build_type = str(payload.get("buildType", "release")).strip().lower()
          if build_type not in {"debug", "release"}:
              build_type = "release"

          values = {
              "BUILD_MODE": mode,
              "BUILD_TYPE": build_type,
              "SOURCE_URL": str(payload.get("url", "")).strip(),
              "SOURCE_ASSET_ID": str(payload.get("assetId", "")).strip(),
              "SOURCE_REPO": str(payload.get("sourceRepo", "")).strip(),
              "SOURCE_ASSET_NAME_B64": base64.b64encode(str(payload.get("assetName", "project.zip")).encode()).decode(),
              "ICON_URL": str(payload.get("iconUrl", "")).strip(),
              "APP_NAME_B64": base64.b64encode(str(payload.get("appName", "KING Web App")).encode()).decode(),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
          PY

      - name: Fast environment check
        shell: bash
        run: |
          flutter --version
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"

      # ═══════════════════════════════════════════════════════════════
      # WORKER SELF-TEST (mode: doctor)
      # ═══════════════════════════════════════════════════════════════
      - name: Worker self-test
        if: env.BUILD_MODE == 'doctor'
        shell: bash
        timeout-minutes: 30
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/king_worker_test"
          flutter create --platforms=android --project-name king_worker_test "$RUNNER_TEMP/king_worker_test"
          cd "$RUNNER_TEMP/king_worker_test"
          timeout --foreground 8m flutter pub get
          timeout --foreground 20m flutter build apk --release --no-pub
          test -s build/app/outputs/flutter-apk/app-release.apk
          echo "✅ Worker self-test APK berhasil."

      # ═══════════════════════════════════════════════════════════════
      # DOWNLOAD PROJECT (mode: zip)
      # ═══════════════════════════════════════════════════════════════
      - name: Download and prepare Flutter project
        if: env.BUILD_MODE == 'zip'
        shell: bash
        timeout-minutes: 15
        run: |
          set -e
          echo "═══════════ PAYLOAD ═══════════"
          echo "SOURCE_ASSET_ID: [$SOURCE_ASSET_ID]"
          echo "SOURCE_REPO    : [$SOURCE_REPO]"
          echo "════════════════════════════════"

          if [ -z "$SOURCE_ASSET_ID" ] && [ -z "$SOURCE_URL" ]; then
            echo "::error title=PAYLOAD KOSONG::Bot tidak kirim assetId/url!"
            exit 20
          fi

          rm -rf "$RUNNER_TEMP/king_source"
          mkdir -p "$RUNNER_TEMP/king_source"
          rm -f "$RUNNER_TEMP/project.zip"

          if [ -n "$SOURCE_ASSET_ID" ]; then
            REPO="${SOURCE_REPO:-${{ github.repository }}}"
            API_URL="https://api.github.com/repos/${REPO}/releases/assets/${SOURCE_ASSET_ID}"
            HTTP_CODE=$(curl --silent --show-error --location --http1.1 \
              --retry 5 --retry-delay 2 --retry-max-time 300 \
              --connect-timeout 30 --max-time 600 \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -w "%{http_code}" \
              -o "$RUNNER_TEMP/project.zip" "$API_URL" || echo "000")
            echo "📡 HTTP: $HTTP_CODE"
          else
            HTTP_CODE=$(curl --silent --show-error --location --http1.1 \
              --retry 5 --retry-delay 2 --retry-max-time 300 \
              --connect-timeout 30 --max-time 600 \
              -H "Authorization: Bearer ${{ github.token }}" \
              -w "%{http_code}" \
              -o "$RUNNER_TEMP/project.zip" "$SOURCE_URL" || echo "000")
            echo "📡 HTTP: $HTTP_CODE"
          fi

          [ -f "$RUNNER_TEMP/project.zip" ] || { echo "::error::File hilang"; exit 21; }
          SIZE=$(stat -c '%s' "$RUNNER_TEMP/project.zip")
          echo "📦 Size: $SIZE bytes"
          [ "$SIZE" -gt 0 ] || { echo "::error::File kosong"; exit 22; }

          HEADER=$(head -c 2 "$RUNNER_TEMP/project.zip")
          [ "$HEADER" = "PK" ] || {
            echo "::error::Bukan ZIP. Header=[$HEADER]"
            head -c 500 "$RUNNER_TEMP/project.zip" | strings | head -10
            exit 23
          }

          unzip -tq "$RUNNER_TEMP/project.zip" >/dev/null || { echo "::error::ZIP corrupt"; exit 24; }
          echo "✅ ZIP valid: $(numfmt --to=iec $SIZE)"

          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/king_source"

          PUBSPEC="$(find "$RUNNER_TEMP/king_source" -type f -name pubspec.yaml -not -path '*/.dart_tool/*' | head -n 1)"
          [ -n "$PUBSPEC" ] || { echo "::error::pubspec.yaml tidak ada"; exit 25; }

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      # ═══════════════════════════════════════════════════════════════
      # AUTO-PATCH — Paksa semua versi ke known-good
      # ═══════════════════════════════════════════════════════════════
      - name: Auto-patch Flutter project
        if: env.BUILD_MODE == 'zip'
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import os, re, pathlib

          proj = pathlib.Path(os.environ["PROJECT_DIR"]).resolve()

          # ─── 1. GRADLE WRAPPER → 8.14.0 (force) ───
          wrapper = proj / "android" / "gradle" / "wrapper" / "gradle-wrapper.properties"
          wrapper.parent.mkdir(parents=True, exist_ok=True)
          wrapper.write_text(
              "distributionBase=GRADLE_USER_HOME\n"
              "distributionPath=wrapper/dists\n"
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.0-bin.zip\n"
              "networkTimeout=10000\n"
              "validateDistributionUrl=true\n"
              "zipStoreBase=GRADLE_USER_HOME\n"
              "zipStorePath=wrapper/dists\n",
              encoding="utf-8"
          )
          print("[PATCH] Gradle wrapper → 8.14.0 ✅")

          # ─── 2. SETTINGS.GRADLE → force AGP + Kotlin ───
          for settings in [proj / "android" / "settings.gradle",
                           proj / "android" / "settings.gradle.kts"]:
              if not settings.exists():
                  continue
              txt = settings.read_text(encoding="utf-8")

              txt = re.sub(
                  r'id\s+["\']com\.android\.application["\']\s+version\s+["\'][^"\']+["\']',
                  'id "com.android.application" version "8.7.0"', txt)
              txt = re.sub(
                  r'id\s+["\']com\.android\.library["\']\s+version\s+["\'][^"\']+["\']',
                  'id "com.android.library" version "8.7.0"', txt)
              txt = re.sub(
                  r'id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'][^"\']+["\']',
                  'id "org.jetbrains.kotlin.android" version "2.1.0"', txt)
              txt = re.sub(
                  r'id\s+["\']org\.jetbrains\.kotlin\.jvm["\']\s+version\s+["\'][^"\']+["\']',
                  'id "org.jetbrains.kotlin.jvm" version "2.1.0"', txt)
              txt = re.sub(
                  r'id\s+["\']org\.jetbrains\.kotlin\.plugin\.serialization["\']\s+version\s+["\'][^"\']+["\']',
                  'id "org.jetbrains.kotlin.plugin.serialization" version "2.1.0"', txt)

              settings.write_text(txt, encoding="utf-8")
              print(f"[PATCH] {settings.name} → AGP 8.7.0 + Kotlin 2.1.0 ✅")

          # ─── 3. GRADLE.PROPERTIES ───
          gp = proj / "android" / "gradle.properties"
          existing = gp.read_text(encoding="utf-8") if gp.exists() else ""
          # Hapus dulu existing kalo udah ada, kita timpa
          if existing:
              # Buang baris yang konflik
              lines = [l for l in existing.split("\n")
                       if not re.match(r'^(org\.gradle|android\.(useAndroidX|enableJetifier|enableR8|newDsl|builtInKotlin))', l.strip())]
              existing = "\n".join(lines).strip() + "\n\n"

          new_props = (
              "# Auto-patch by KING Build Worker\n"
              "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\n"
              "org.gradle.parallel=true\n"
              "org.gradle.caching=true\n"
              "org.gradle.daemon=false\n"
              "org.gradle.configureondemand=true\n"
              "android.useAndroidX=true\n"
              "android.enableJetifier=true\n"
              "android.enableR8.fullMode=false\n"
              "android.newDsl=false\n"
              "android.builtInKotlin=false\n"
              "android.defaults.buildfeatures.buildconfig=true\n"
              "android.nonTransitiveRClass=false\n"
              "android.nonFinalResIds=false\n"
          )
          gp.write_text(existing + new_props, encoding="utf-8")
          print("[PATCH] gradle.properties ✅")

          # ─── 4. ANDROID/APP/BUILD.GRADLE(.KTS) ───
          for bg in [proj / "android" / "app" / "build.gradle",
                     proj / "android" / "app" / "build.gradle.kts"]:
              if not bg.exists():
                  continue
              txt = bg.read_text(encoding="utf-8")
              is_kts = bg.suffix == ".kts"

              # Namespace
              if "namespace" not in txt:
                  m = re.search(r'applicationId\s*[=]?\s*["\']([^"\']+)["\']', txt)
                  if m:
                      app_id = m.group(1)
                      ns_line = f'    namespace = "{app_id}"' if is_kts else f'    namespace "{app_id}"'
                      txt = re.sub(r'(android\s*\{)', f'\\1\n{ns_line}', txt, count=1)
                      print(f"[PATCH] namespace = {app_id} ✅")

              # SDK versions
              for old, new in [
                  (r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21'),
                  (r'minSdkVersion\s+[0-9]+', 'minSdkVersion 21'),
                  (r'minSdk\s*=\s*[0-9]+', 'minSdk = 21'),
                  (r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21'),
                  (r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 34'),
                  (r'compileSdkVersion\s+[0-9]+', 'compileSdkVersion 34'),
                  (r'compileSdk\s*=\s*[0-9]+', 'compileSdk = 34'),
                  (r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 34'),
                  (r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34'),
                  (r'targetSdkVersion\s+[0-9]+', 'targetSdkVersion 34'),
                  (r'targetSdk\s*=\s*[0-9]+', 'targetSdk = 34'),
                  (r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34'),
              ]:
                  txt = re.sub(old, new, txt)

              # NDK
              if "ndkVersion" not in txt:
                  ndk_line = '    ndkVersion = "26.1.10909125"' if is_kts else '    ndkVersion "26.1.10909125"'
                  txt = re.sub(r'(android\s*\{)', f'\\1\n{ndk_line}', txt, count=1)
                  print("[PATCH] ndkVersion ✅")

              # MultiDex
              if "multiDexEnabled" not in txt:
                  txt = re.sub(r'(defaultConfig\s*\{)', '\\1\n        multiDexEnabled true', txt, count=1)
                  print("[PATCH] multiDexEnabled ✅")

              # Force signing dengan debug key (biar gak gagal karena signing config)
              if "signingConfigs" in txt and "release" in txt:
                  # Ganti release signing jadi debug kalau ada issue
                  pass  # skip dulu, terlalu risky

              bg.write_text(txt, encoding="utf-8")
              print(f"[PATCH] {bg.name} ✅")

          # ─── 5. HAPUS file yang sering konflik ───
          for conflict in [
              proj / "android" / ".gradle",
              proj / "android" / "build",
              proj / ".dart_tool",
              proj / "build",
              proj / "android" / "app" / ".cxx",
          ]:
              if conflict.exists():
                  import shutil
                  shutil.rmtree(conflict, ignore_errors=True)

          print("[PATCH] Cache lama dibersihkan ✅")
          PY

          echo "═══════════ VERIFY ═══════════"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          grep -E "com.android.application" android/settings.gradle* 2>/dev/null | head -2
          grep -E "newDsl|builtInKotlin" android/gradle.properties
          echo "═══════════════════════════════"

          # Warm up gradle wrapper
          cd android && timeout 120s ./gradlew --version 2>&1 | head -5 || true
          cd ..

      # ═══════════════════════════════════════════════════════════════
      # WEBVIEW APP (mode: url)
      # ═══════════════════════════════════════════════════════════════
      - name: Generate WebView application
        if: env.BUILD_MODE == 'url'
        shell: bash
        timeout-minutes: 15
        run: |
          set -e
          [ -n "$SOURCE_URL" ] || { echo "URL kosong" >&2; exit 30; }

          APP_DIR="$RUNNER_TEMP/king_webapp"
          rm -rf "$APP_DIR"
          flutter create --platforms=android --org com.kingbuild --project-name king_webapp "$APP_DIR"
          echo "PROJECT_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          flutter pub add webview_flutter

          python3 - <<'PY'
          import base64, html, json, os, pathlib, re
          project = pathlib.Path(os.environ["RUNNER_TEMP"]) / "king_webapp"
          app_name = base64.b64decode(os.environ["APP_NAME_B64"]).decode("utf-8", "replace").strip() or "KING Web App"
          web_url = os.environ["SOURCE_URL"].strip()

          dart = f'''import 'package:flutter/material.dart';
import 'package:webview_flutter/webview_flutter.dart';

void main() {{
  WidgetsFlutterBinding.ensureInitialized();
  runApp(const KingWebApplication());
}}

class KingWebApplication extends StatelessWidget {{
  const KingWebApplication({{super.key}});
  @override
  Widget build(BuildContext context) {{
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: {json.dumps(app_name)},
      theme: ThemeData(useMaterial3: true),
      home: const KingWebScreen(),
    );
  }}
}}

class KingWebScreen extends StatefulWidget {{
  const KingWebScreen({{super.key}});
  @override
  State<KingWebScreen> createState() => _KingWebScreenState();
}}

class _KingWebScreenState extends State<KingWebScreen> {{
  late final WebViewController controller;
  int loadingProgress = 0;

  @override
  void initState() {{
    super.initState();
    controller = WebViewController()
      ..setJavaScriptMode(JavaScriptMode.unrestricted)
      ..setBackgroundColor(const Color(0xFFFFFFFF))
      ..setNavigationDelegate(NavigationDelegate(
        onProgress: (value) => setState(() => loadingProgress = value),
      ))
      ..loadRequest(Uri.parse({json.dumps(web_url)}));
  }}

  @override
  Widget build(BuildContext context) {{
    return Scaffold(
      body: SafeArea(
        child: Stack(children: [
          WebViewWidget(controller: controller),
          if (loadingProgress < 100)
            LinearProgressIndicator(value: loadingProgress / 100),
        ]),
      ),
    );
  }}
}}
'''
          dart = "\n".join(l.lstrip() for l in dart.splitlines()) + "\n"
          (project / "lib" / "main.dart").write_text(dart, encoding="utf-8")

          mp = project / "android" / "app" / "src" / "main" / "AndroidManifest.xml"
          manifest = mp.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in manifest:
              close = manifest.find(">")
              manifest = manifest[:close+1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + manifest[close+1:]
          manifest = re.sub(r'android:label="[^"]*"', f'android:label="{html.escape(app_name, quote=True)}"', manifest, count=1)
          mp.write_text(manifest, encoding="utf-8")
          PY

          # Download icon
          if [ -n "$ICON_URL" ]; then
            curl --fail --silent --show-error --location --http1.1 \
              --retry 3 --retry-max-time 180 \
              --connect-timeout 30 --max-time 300 \
              -H "Authorization: Bearer ${{ github.token }}" \
              -o "$RUNNER_TEMP/king_icon" "$ICON_URL" || true

            if [ -s "$RUNNER_TEMP/king_icon" ]; then
              python3 -m pip install --disable-pip-version-check --quiet --user pillow
              python3 - <<'PY'
from pathlib import Path
from PIL import Image, ImageOps
import os
src = Path(os.environ["RUNNER_TEMP"]) / "king_icon"
root = Path(os.environ["RUNNER_TEMP"]) / "king_webapp" / "android" / "app" / "src" / "main" / "res"
sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
img = Image.open(src).convert("RGBA")
img = ImageOps.fit(img, (512, 512), method=Image.Resampling.LANCZOS)
for folder, size in sizes.items():
    t = root / folder
    t.mkdir(parents=True, exist_ok=True)
    img.resize((size, size), Image.Resampling.LANCZOS).save(t / "ic_launcher.png")
PY
            fi
          fi

          # Patch gradle untuk webview app juga
          cat >> "$APP_DIR/android/gradle.properties" << 'EOF'

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
android.builtInKotlin=false
EOF

      # ═══════════════════════════════════════════════════════════════
      # PUB GET
      # ═══════════════════════════════════════════════════════════════
      - name: Flutter pub get
        if: env.BUILD_MODE != 'doctor'
        shell: bash
        timeout-minutes: 10
        run: |
          cd "$PROJECT_DIR"
          timeout --foreground 8m flutter pub get

      # ═══════════════════════════════════════════════════════════════
      # BUILD — 4 STRATEGI RETRY
      # ═══════════════════════════════════════════════════════════════
      - name: Build APK with multi-strategy retry
        if: env.BUILD_MODE != 'doctor'
        shell: bash
        timeout-minutes: 40
        run: |
          set -e
          cd "$PROJECT_DIR"
          [ "$BUILD_MODE" = "url" ] && BUILD_TYPE="release"

          # ─── STRATEGI 1: Build normal ───
          echo "═══════════ ATTEMPT 1: Normal build ═══════════"
          build_apk() {
            local flag="--release"
            [ "$BUILD_TYPE" = "debug" ] && flag="--debug"
            timeout --foreground 25m flutter build apk $flag --no-pub 2>&1 | tail -100
            return ${PIPESTATUS[0]}
          }

          set +e
          build_apk
          R1=$?
          set -e

          if [ "$R1" -eq 0 ]; then
            echo "✅ ATTEMPT 1: SUCCESS"
          else
            # ─── STRATEGI 2: Clean + rebuild ───
            echo ""
            echo "═══════════ ATTEMPT 2: Clean rebuild ═══════════"
            flutter clean || true
            rm -rf .dart_tool build android/.gradle android/app/.cxx 2>/dev/null || true
            timeout 8m flutter pub get || true
            cd android && ./gradlew --stop 2>/dev/null || true && cd ..
            cd "$PROJECT_DIR"

            set +e
            build_apk
            R2=$?
            set -e

            if [ "$R2" -eq 0 ]; then
              echo "✅ ATTEMPT 2: SUCCESS"
            else
              # ─── STRATEGI 3: Regenerate android/ folder (NUCLEAR) ───
              echo ""
              echo "═══════════ ATTEMPT 3: NUCLEAR — Regenerate android/ ═══════════"
              rm -rf android
              timeout 10m flutter create --platforms=android . || true

              # Re-patch fresh android folder
              python3 - <<'PY'
import os, re, pathlib
proj = pathlib.Path(os.environ["PROJECT_DIR"]).resolve()

# Wrapper
w = proj / "android" / "gradle" / "wrapper" / "gradle-wrapper.properties"
w.parent.mkdir(parents=True, exist_ok=True)
w.write_text(
    "distributionBase=GRADLE_USER_HOME\n"
    "distributionPath=wrapper/dists\n"
    "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.0-bin.zip\n"
    "networkTimeout=10000\n"
    "validateDistributionUrl=true\n"
    "zipStoreBase=GRADLE_USER_HOME\n"
    "zipStorePath=wrapper/dists\n",
    encoding="utf-8"
)

# gradle.properties
(proj / "android" / "gradle.properties").write_text(
    "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n"
    "org.gradle.parallel=true\n"
    "org.gradle.caching=true\n"
    "org.gradle.daemon=false\n"
    "android.useAndroidX=true\n"
    "android.enableJetifier=true\n"
    "android.newDsl=false\n"
    "android.builtInKotlin=false\n",
    encoding="utf-8"
)

# settings.gradle — force versions
for s in [proj / "android" / "settings.gradle", proj / "android" / "settings.gradle.kts"]:
    if not s.exists(): continue
    txt = s.read_text(encoding="utf-8")
    txt = re.sub(r'id\s+["\']com\.android\.application["\']\s+version\s+["\'][^"\']+["\']',
                 'id "com.android.application" version "8.7.0"', txt)
    txt = re.sub(r'id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'][^"\']+["\']',
                 'id "org.jetbrains.kotlin.android" version "2.1.0"', txt)
    s.write_text(txt, encoding="utf-8")

print("[NUCLEAR] android/ regenerated + patched ✅")
PY

              timeout 8m flutter pub get || true

              set +e
              build_apk
              R3=$?
              set -e

