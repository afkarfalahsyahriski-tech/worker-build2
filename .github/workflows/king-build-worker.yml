                echo ""
                echo "═══════════ ATTEMPT 4: Skip validation flag ═══════════"
                flutter clean || true
                rm -rf .dart_tool build android/.gradle 2>/dev/null || true
                timeout 8m flutter pub get || true

                set +e
                if [ "$BUILD_TYPE" = "debug" ]; then
                  timeout --foreground 25m flutter build apk --debug --no-pub --android-skip-build-dependency-validation 2>&1 | tail -100
